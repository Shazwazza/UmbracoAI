workflow:
  name: umbraco-demo
  description: >-
    End-to-end Umbraco blogging-site demo expressed as a Conductor multi-agent
    workflow. Covers the umbraco-demo steps: optional reset, branch setup, then
    home page, blog pages, navigation, blog posts, images, tag cloud, sitemap and
    accessibility — validating each step in Playwright and committing per step.
    The blog-posts step is parallelised to show Conductor's strengths: a
    deterministic plan agent, a for_each fan-out that authors every post body
    concurrently, then a join that persists them to Umbraco in parallel batches.
    Designed to run as a live conference demonstration with a single, persistent
    Playwright browser window.
  version: "1.0.0"
  entry_point: gate_reset

  input:
    site_base_url:
      type: string
      required: false
      default: "http://localhost:14738"
      description: Base URL of the running Umbraco site (the Conductor environment site).

  runtime:
    provider: copilot
    default_model: claude-opus-4.7
    # Each step performs many MCP tool round-trips, so allow a high ceiling.
    max_agent_iterations: 200
    mcp_servers:
      umbraco-mcp:
        command: npx
        # The Copilot provider has a known bug (copilot-sdk#163) where the per-server
        # `env:` block below is NOT forwarded to the MCP subprocess. The Copilot CLI
        # also auto-discovers the workspace `.mcp.json` (pinned to the traditional
        # site on :14737) and that leaks UMBRACO_BASE_URL=14737 into the environment.
        # CLI flags ARE forwarded and take precedence over env vars in mcp-dev's config
        # resolution, so we pass the Conductor site URL (and tool collections) as flags
        # to guarantee this server targets :14738 regardless of the leaked env var.
        # (Credentials have no CLI flag by design and continue to come from the env.)
        args:
          - "@umbraco-cms/mcp-dev@latest"
          - "--umbraco-base-url"
          - "http://localhost:14738"
          - "--umbraco-include-tool-collections"
          - "data-type,document-type,document,media,property-type,partial-view,static-file,stylesheet,temporary-file,imaging,template"
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          UMBRACO_CLIENT_ID: "umbraco-back-office-mcp"
          UMBRACO_CLIENT_SECRET: "1234567890"
          UMBRACO_BASE_URL: "http://localhost:14738"
          UMBRACO_INCLUDE_TOOL_COLLECTIONS: "data-type,document-type,document,media,property-type,partial-view,static-file,stylesheet,temporary-file,imaging,template"
        tools: ["*"]
      playwright:
        type: http
        url: http://localhost:8932/mcp
        tools: ["*"]
      a11y-accessibility:
        command: npx
        args: ["-y", "a11y-mcp-server"]
        tools: ["*"]

  context:
    mode: accumulate

  limits:
    # Steps + gate + backup + reset + branch setup + plan/fan-out/join +
    # final, with headroom.
    max_iterations: 50

  # Shared orchestration preamble prepended to every agent. The full repository
  # rules (copilot-instructions.md + .github/instructions/**) are layered in at
  # run time via the `--workspace-instructions` flag (see SKILL.md).
  #
  # This preamble is the SINGLE source of the cross-cutting rules (SITE URL,
  # browser persistence, Umbraco MCP write ordering, and per-step VALIDATION &
  # COMMIT). Because it is prepended to every agent, the per-step `system_prompt`
  # blocks deliberately do NOT restate validation/commit boilerplate, and each
  # step's `!file` SKILL.md already carries its own step-specific Validation/
  # Commit detail. Keep step `system_prompt`s limited to genuinely step-specific
  # context (e.g. visual-identity continuity, the one-time browser open) to avoid
  # re-sending the same instructions three times per step.
  instructions:
    - |
      You are one agent in a live, on-stage Umbraco blogging-site demo. The
      Playwright browser window is projected to a conference audience.

      SITE URL — the single source of truth for this workflow:
      - For THIS workflow, `SITE_BASE_URL` is `http://localhost:14738` — the
        Conductor environment site (it is this workflow's `site_base_url` input).
      - Whenever an embedded skill or instruction refers to `SITE_BASE_URL`, it
        means `http://localhost:14738`. Use this for EVERY Playwright
        `browser_navigate`, every accessibility-tool URL, the sitemap script
        `-BaseUrl`, and any other site URL you build.
      - IGNORE the `http://localhost:14737` value documented in
        `copilot-instructions.md`. That port is the *traditional* demo site and
        has a SEPARATE database; navigating there shows the wrong site to the
        audience. This workflow NEVER touches :14737.

      CRITICAL BROWSER RULES — obey at all times:
      - NEVER call `browser_close` or any tool that closes, quits, or stops the
        browser. There is NO point at which closing the browser is correct.
      - The browser is opened ONCE (the first `browser_navigate` of the demo,
        in the home-page step) and then REUSED for every later navigation.
        Always move to a new page with `browser_navigate`, never by closing and
        reopening. The browser persists across every agent in this workflow.
      - Leave the browser OPEN at the end of your step and hand it to the next
        agent still open on the site.

      UMBRACO MCP RULES:
      - Use ONLY the umbraco-mcp tools for Umbraco backoffice operations. Never
        use curl or direct HTTP/API calls to Umbraco.
      - The blog hero images are sourced by a script
        (`.github/skills/umb-image-sourcing/source-blog-images.ps1`) which queries Unsplash and prints a
        compact mapping. That script — and any fetch tool — is for IMAGE
        DISCOVERY ONLY. Umbraco access is always through umbraco-mcp.
      - Per-document content writes (create, update, publish, unpublish) to
        DISTINCT nodes MAY be issued together in one parallel tool batch — this
        is verified deadlock-free on LocalDB and is the preferred way to persist
        many posts/images quickly. Keep writes sequential only when they target
        the SAME node or depend on each other (e.g. create-then-publish, or
        assign-heroImage-then-publish, for one post: do those in order). Tree
        moves, deletes that reshape the tree, and document-type/data-type schema
        changes should still be issued one at a time. Read operations (`get-*`,
        `search-*`, `find-*`) may always be parallelised.
      - After creating or updating any document, immediately call
        `publish-document`. Unpublished drafts are invisible on the front-end.
      - After a `publish-document` (or a parallel BATCH of publishes) succeeds,
        immediately re-navigate the persistent browser with `browser_navigate` to
        the public front-end URL affected (for blog posts, the Blog List page) so
        the audience sees the change appear live before you move on. When you
        publish a batch in parallel, one refresh after the batch is enough — every
        post lands on screen at once, which is great on-stage drama. Only ever
        move with `browser_navigate` — never close/reopen the browser. This
        refresh is IN ADDITION TO the per-step validation navigation below, not a
        replacement for it.

      PER-STEP VALIDATION & COMMIT (mandatory):
      - After completing the work for your step, use Playwright to navigate to
        the relevant page and confirm it renders without errors. A page has an
        error if a `div` with id `stackpage` is present — fix it before
        finishing.
      - Validate ONLY with the provided Playwright `browser_*` MCP tools (e.g.
        `browser_navigate`, `browser_snapshot`). You MUST NOT install Playwright
        or any npm package, MUST NOT write or run a custom script (JS/Node/shell)
        to load or check the site, and MUST NOT use curl or direct HTTP requests
        for validation. If the `browser_*` MCP tools are not available to you,
        STOP immediately and report that the Playwright MCP server is
        unavailable — do not improvise an alternative validation method.
      - Then make a git commit for your step before reporting done. Each step
        gets its own commit. The step is not complete until the commit exists.
        Include this trailer in the commit message:
        `Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>`

agents:
  # ---------------------------------------------------------------------------
  # Pre-flight: optional reset, then branch setup
  # ---------------------------------------------------------------------------
  - name: gate_reset
    type: human_gate
    prompt: |
      Welcome to the Umbraco blogging-site demo.

      Site: {{ workflow.input.site_base_url }}

      Would you like to reset the Umbraco site to a clean state before building
      the demo? Choosing "Yes" backs up the database first, then wipes all
      existing content, media, templates, document types, and CSS.
    options:
      - label: "Yes — back up and reset to a clean slate first"
        value: reset
        route: backup
      - label: "No — keep the current site and just build"
        value: keep
        route: branch_setup

  - name: backup
    description: Back up the Umbraco LocalDB database before destructive changes.
    # Trivial shell step — a fast model is plenty.
    model: claude-haiku-4.5
    system_prompt: |
      You are performing the database BACKUP step of the demo, before any
      reset. Follow the included skill instructions exactly. This step does not
      require a git commit or Playwright validation.
    prompt: !file ../umb-backup/SKILL.md
    routes:
      - to: reset

  - name: reset
    description: Wipe all existing Umbraco content, media, templates, and types.
    system_prompt: |
      You are performing the RESET step of the demo. Follow the included skill
      instructions exactly to return the site to its default empty state. This
      step does not require a git commit. After resetting, you may navigate the
      browser to the site to show the audience it is now empty (do NOT close the
      browser).
    prompt: !file ../umb-reset/SKILL.md
    routes:
      - to: branch_setup

  - name: branch_setup
    description: "Step 0 — ensure work happens on a develop branch."
    # A few git commands — use a fast model.
    model: claude-haiku-4.5
    system_prompt: |
      You are performing Step 0 (Branch Setup) of the demo. Do not build any
      content in this step and do not commit anything.
    prompt: |
      Ensure all subsequent Umbraco changes happen on a develop branch, never on
      main/master.

      1. Run `git branch --show-current`.
      2. If the current branch is `main` or `master`:
         - List existing develop branches with `git branch --list 'develop/*'`
           to avoid name collisions.
         - Create and check out a NEW, unique branch named
           `develop/demo-build-<today's date>` (add a short suffix like `-v2`
           if that name already exists), e.g.:
           `git checkout -b develop/demo-build-YYYY-MM-DD`.
      3. If the current branch is already a `develop/*` branch, stay on it.

      Report the branch you ended up on. Do not proceed to build anything here.
    routes:
      - to: step1a_homepage_structure

  # ---------------------------------------------------------------------------
  # The 8 demo steps — each embeds its existing skill via !file
  # ---------------------------------------------------------------------------
  # Step 1 is split into two nodes for a stronger live-demo narrative:
  #   1a) build the Home structure + an UNSTYLED template and publish, so the
  #       audience sees raw, theme-less content appear, then
  #   1b) invent the visual theme — master layout + CSS — and refactor the
  #       template, so the audience watches the page transform on refresh.
  - name: step1a_homepage_structure
    description: "Step 1a — Home page structure (unstyled, published)."
    system_prompt: |
      You are executing Step 1a (Home page structure) of the live Umbraco demo.
      This step deliberately produces a PLAIN, UNSTYLED page — the visual theme
      and CSS come in the NEXT step (1b), so the audience can watch the page
      transform. Do NOT write any CSS, do NOT create `_Layout.cshtml`, and do
      NOT invent a colour palette or theme here.

      Conductor-specific note: before creating anything, FIRST open the browser
      with `browser_navigate` to {{ workflow.input.site_base_url }} and show the
      audience that the site is currently empty (the default/blank Umbraco
      state). This is the single time the browser is opened — reuse this window
      for the rest of the demo.

      Do the following, using the umbraco-mcp tools for all Umbraco operations:
      1. Create a `Home` Document Type at the root with a few sensible
         properties for a landing page (e.g. a heading/title text field, a
         subtitle/tagline, and a body rich-text or markdown field). Use only
         built-in property editors.
      2. Create a `Home` Template via the template MCP tool, then link it to the
         Home Document Type (set it as an allowed template AND the default
         template — creating a template does not auto-link it).
      3. Edit `src/MyProject/Views/home.cshtml` on the filesystem so it renders
         the Home content fields with MINIMAL, unstyled markup. Use
         `@inherits Umbraco.Cms.Web.Common.Views.UmbracoViewPage` and
         `Layout = null;` with a bare `<html><body>` that just outputs the
         heading/subtitle/body values. No CSS, no classes, no `/css/site.css`
         link — raw HTML only. (Step 1b will introduce the shared layout.)
      4. Create a `Home` content node at the root of the content tree, fill in
         the fields, and PUBLISH it (`publish-document` — drafts are invisible).
      5. Validate with Playwright in the SAME browser window: navigate to
         {{ workflow.input.site_base_url }} and confirm the page loads with no
         `div#stackpage` error and shows the raw, unstyled content.
      6. Commit: `git add -A` then
         `git commit -m "Step 1a: Home page structure (unstyled) — doc type, template, published content"`.
         The commit is mandatory; the step is not done until it exists.

      A 500 error / `div#stackpage` right after editing the `.cshtml` is a Razor
      compile error in that view (views compile at runtime) — fix the view and
      refresh; never restart the site.
    prompt: |
      Build the Home page structure now: Home document type + linked template,
      a minimal UNSTYLED `home.cshtml`, and a published Home root node. No CSS or
      theme in this step. Validate the raw page renders, then commit as Step 1a.
    routes:
      - to: step1b_homepage_style

  - name: step1b_homepage_style
    description: "Step 1b — Home page visual theme (CSS + master layout)."
    system_prompt: |
      You are executing Step 1b (Home page styling) of the live Umbraco demo.
      The Home Document Type, template, and a PUBLISHED Home node already exist
      from Step 1a, rendering as plain unstyled HTML in the browser window that
      is already open. Your job is to bring the page to life with a brand-new
      visual identity, so the audience sees it transform on the next refresh.
      Do NOT recreate the document type or content — only add styling and the
      shared layout, then update the template.

      Follow the included skill instructions for the design, the shared
      `_Layout.cshtml` master layout, the `/css/site.css`, and the HMAC image
      rule. Concretely:
      - Invent an ORIGINAL theme for THIS run (unique colour palette, typography
        feel, layout style) — do not reuse themes from previous builds.
      - Create the shared master layout `src/MyProject/Views/_Layout.cshtml`
        (the `<!DOCTYPE>`, `<head>`, `/css/site.css` link, header/footer,
        `@RenderBody()`) as described in the skill, and create `/css/site.css`.
      - Refactor `src/MyProject/Views/home.cshtml` to set
        `Layout = "_Layout.cshtml";` and contain only its unique, now-styled
        content (remove the bare `<html>/<body>` shell added in Step 1a).
      - Do NOT restart the site after editing `.cshtml`/CSS — Razor and static
        files are picked up at runtime; just refresh the browser.
      - Validate in the SAME browser window by refreshing
        {{ workflow.input.site_base_url }}: the page now renders with the full
        theme (no `div#stackpage` error), confirming the visual transition.
      - Commit: `git add -A` then
        `git commit -m "Step 1b: Home page theme — <brief summary of the visual identity>"`.
        Ignore the skill's own "Step 1" commit wording; use the Step 1b message.
    prompt: !file ../umb-homepage/SKILL.md
    routes:
      - to: step2_blog_pages

  - name: step2_blog_pages
    description: "Step 2 — Blog List and Blog Post pages."
    system_prompt: |
      You are executing Step 2 (Blog pages) of the live Umbraco demo; follow the
      skill instructions below. Keep the visual identity established in Step 1
      consistent across these pages. (The skill already requires EXACTLY ONE
      starter blog post — do NOT create additional posts here.)
    prompt: !file ../umb-blog-pages/SKILL.md
    routes:
      - to: step3_navigation

  - name: step3_navigation
    description: "Step 3 — Site-wide navigation."
    system_prompt: |
      You are executing Step 3 (Navigation) of the live Umbraco demo; follow the
      skill instructions below to add shared navigation to all pages, keeping the
      Step 1 visual identity consistent.
    prompt: !file ../umb-navigation/SKILL.md
    routes:
      - to: step4_plan_posts

  # Step 4 is split into three nodes to showcase Conductor's strengths:
  #   4)  a deterministic PLAN agent emits a typed JSON contract,
  #   4·) a for_each FAN-OUT authors every post body concurrently (pure text —
  #       no Umbraco writes, no browser, so it is safe to parallelise), then
  #   4b) a JOIN agent persists them to Umbraco in parallel BATCHES (per-post
  #       content writes to distinct nodes are verified deadlock-free on LocalDB,
  #       so creates and publishes can each go out as one parallel wave).
  - name: step4_plan_posts
    description: "Step 4 — Plan the remaining blog posts (deterministic contract)."
    system_prompt: |
      You are executing Step 4 (Plan posts) of the live Umbraco demo. You do NOT
      author full post bodies here and you do NOT create anything in Umbraco yet.

      Goal: decide the set of blog posts so the site ends with EXACTLY 10 total.
      Step 2 already created one starter post, so first COUNT the existing
      published blog posts under the Blog List page using the umbraco-mcp read
      tools, then plan only enough NEW posts to reach 10 (typically 9). Do not
      plan posts that would exceed 10.

      For each new post, invent an ORIGINAL topic for THIS run, written from your
      first-person perspective as the AI agent that built this site (something you
      struggled with, a design decision, a technique that impressed you, a
      reflection for the Codegarden audience, etc.). Do NOT reuse topics or
      wording from previous runs.

      Emit a deterministic, machine-readable plan: one object per NEW post with a
      url-safe `slug`, a `title`, a `subtitle`, 2–4 relevant `tags`, and a short,
      concrete `image_query` (2–4 words for an Unsplash photo search, e.g.
      "artificial intelligence", "developer workflow"). This array is the
      contract the next steps consume — return it exactly via the `posts` output.
    prompt: |
      Produce the plan for the remaining blog posts now, as described in your
      instructions. Return ONLY the structured `posts` array — no prose, no
      Umbraco changes, no browser navigation, and no git commit in this step.
    output:
      posts:
        type: array
        description: One entry per NEW blog post to author and publish.
        items:
          type: object
          properties:
            slug: { type: string }
            title: { type: string }
            subtitle: { type: string }
            tags:
              type: array
              items: { type: string }
            image_query: { type: string }
    routes:
      - to: author_posts

  - name: step4b_persist_posts
    description: "Step 4b — Persist the authored posts to Umbraco (parallel-batch join)."
    system_prompt: |
      You are executing Step 4b (Persist posts) of the live Umbraco demo. The post
      bodies were authored CONCURRENTLY in the previous fan-out step. The plan is
      in `{{ step4_plan_posts.output.posts }}` and the authored bodies are in
      `{{ author_posts.outputs }}` (a map keyed by slug, each with `content` and
      `excerpt`). Any posts that failed to author appear in
      `{{ author_posts.errors }}` — if a slug is missing a body, author a short one
      inline so every planned post is still created.

      For EACH planned post, create it under the Blog List page and publish it.
      Match the authored body/excerpt to the plan entry by `slug`. Use
      `Umbraco.TextBox` for title/subtitle, `Umbraco.MarkdownEditor` for content,
      `Umbraco.TextArea` for excerpt, and `Umbraco.Tags` for tags.

      GO FAST — PERSIST IN PARALLEL BATCHES: these posts are independent nodes, so
      do NOT create them one at a time. Issue ALL the `create-document` calls in a
      single parallel tool batch, wait for them to return, then issue ALL the
      `publish-document` calls in a single parallel tool batch. Per-post content
      writes to distinct nodes are verified deadlock-free on LocalDB. The only
      ordering you must respect is create-before-publish for the SAME post, so
      keep creates in the first wave and publishes in the second.

      When all posts are published, validate in Playwright that the Blog List
      shows exactly 10 posts (each with a title, date, and excerpt), then commit
      this step.

      LIVE-DEMO REFRESH: after the publish batch returns, `browser_navigate` to
      the Blog List page once so the audience watches all the new posts appear at
      once — a nice on-stage moment.
    prompt: |
      Persist and publish every planned blog post to Umbraco now (creates in one
      parallel batch, then publishes in one parallel batch), then validate the
      Blog List shows 10 posts and commit.
    routes:
      - to: step5a_image_sourcing

  - name: step5a_image_sourcing
    description: "Step 5a — Source hero images from Unsplash into Umbraco media."
    system_prompt: |
      You are executing Step 5a (Image sourcing) of the live Umbraco demo. Follow
      the included skill instructions to run the discovery script
      (`.github/skills/umb-image-sourcing/source-blog-images.ps1`) ONCE to get a compact slug->image mapping
      from Unsplash, then upload one topical hero image per blog post into a "Blog
      Hero Images" media folder. Build the script's `{slug, query}` list by
      reusing the per-post `image_query` already chosen in the plan
      (`{{ step4_plan_posts.output.posts }}`), falling back to a query derived from
      the post topic for the Step 2 starter post. The script is for image
      discovery ONLY — never use it (or any fetch tool) to reach Umbraco; all
      Umbraco operations go through umbraco-mcp. The script automatically falls
      back to Lorem Picsum so every post still gets an image. This step uploads
      media only — assigning and rendering happens in the next step. Do not
      require a separate commit; the images are committed in the next step.
    prompt: !file ../umb-image-sourcing/SKILL.md
    routes:
      - to: step5_blogpost_images

  - name: step5_blogpost_images
    description: "Step 5 — Hero images on blog posts."
    system_prompt: |
      You are executing Step 5 (Blog post images) of the live Umbraco demo. The
      hero images were already sourced and uploaded into the "Blog Hero Images"
      media folder in Step 5a. Follow the included skill instructions to ASSIGN a
      hero image to each blog post and RENDER thumbnails/heroes in the templates
      (do not re-source images). To save time, assign hero images in a parallel
      batch and republish in a parallel batch — per-post content writes to
      distinct nodes are verified deadlock-free on LocalDB (see the skill). Every
      hero image and list thumbnail MUST have meaningful `alt` text (use the post
      title) so the markup stays accessible — accessibility is validated in a
      later step, so do not introduce images without alt text. Validate that
      images render on the Blog List and a Blog Post page.
    prompt: !file ../umb-blogpost-images/SKILL.md
    routes:
      - to: step6_tagcloud

  - name: step6_tagcloud
    description: "Step 6 — Tag cloud on the Blog List page."
    system_prompt: |
      You are executing Step 6 (Tag cloud) of the live Umbraco demo. Follow the
      included skill instructions to add a tag cloud whose tag sizes reflect how
      frequently each tag appears across posts. Keep the markup accessible —
      tags must be real, keyboard-focusable links with discernible text (do not
      rely on size/colour alone) — since accessibility is validated in a later
      step. Validate that the tag cloud renders on the Blog List page.
    prompt: !file ../umb-tagcloud/SKILL.md
    routes:
      - to: step7_sitemap

  - name: step7_sitemap
    description: "Step 7 — sitemap.xml generation and crawl."
    system_prompt: |
      You are executing Step 7 (Sitemap) of the live Umbraco demo. Follow the
      included skill instructions to generate sitemap.xml from all published
      content and crawl each URL in Playwright to confirm it renders without
      errors.
    prompt: !file ../umb-sitemap/SKILL.md
    routes:
      - to: step8_accessibility

  - name: step8_accessibility
    description: "Step 8 — Accessibility checks and fixes."
    system_prompt: |
      You are executing Step 8 (Accessibility) of the live Umbraco demo. All
      content (blog posts, hero images, tag cloud) is in place now, so this is the
      right moment to validate accessibility across the finished site. Follow the
      included skill instructions to run the a11y-accessibility MCP tool on each
      page, fix issues in the templates/CSS, and repeat until every page reports
      zero violations. When fixing a page, navigate/refresh it in Playwright so the
      audience sees the change. Then commit this step.
    prompt: !file ../umb-accessibility/SKILL.md
    routes:
      - to: final

  # ---------------------------------------------------------------------------
  # Wrap-up
  # ---------------------------------------------------------------------------
  - name: final
    description: Demo wrap-up summary.
    # Plain summary text — a fast model is plenty.
    model: claude-haiku-4.5
    system_prompt: |
      You are wrapping up the live Umbraco demo. Do NOT close the browser —
      leave it OPEN on the finished site for the presenter.
    prompt: |
      The demo build is complete. Do NOT re-crawl the site — just produce a
      concise summary of what was built: pages created, number of blog posts
      authored, the visual theme/identity chosen, skills/steps run, and any
      notable issues fixed along the way.
    output:
      summary:
        type: string
        description: Human-readable summary of everything the demo produced.
    routes:
      - to: $end

# -----------------------------------------------------------------------------
# Dynamic parallel fan-out: author every planned post body concurrently.
# This is the headline parallelism — pure Markdown generation with NO Umbraco
# writes and NO browser, so it is safe to run many at once. The
# step4b_persist_posts join then writes them to Umbraco in parallel batches.
# -----------------------------------------------------------------------------
for_each:
  - name: author_posts
    description: "Step 4· — Author each blog post body in parallel."
    type: for_each
    source: step4_plan_posts.output.posts
    as: post
    key_by: post.slug
    # Posts authored concurrently per batch. Each item is an independent Copilot
    # session doing pure text generation (NO Umbraco, NO browser), so this is the
    # cheapest thing to parallelise. A typical plan is ~9 posts; running them in a
    # single wave (no Umbraco, no browser, pure text on a fast model) is the
    # snappiest option and adds on-stage drama with every post landing at once.
    max_concurrent: 9
    # One flaky post must not abort the demo; the join step backfills any gaps.
    failure_mode: continue_on_error
    agent:
      name: author_post
      # Pure prose generation — a fast model keeps the headline parallel step
      # snappy and cheap; the orchestration/persist steps stay on the default
      # (Sonnet) for correctness.
      model: claude-haiku-4.5
      description: "Author a single blog post body from its plan entry."
      system_prompt: |
        You are one of several agents authoring blog posts CONCURRENTLY for a live
        Umbraco demo. You write text ONLY.

        STRICT RULES:
        - Do NOT call any Umbraco (umbraco-mcp) tool, any Playwright/browser tool,
          or git. Do NOT create, publish, or validate anything. Another agent
          persists your output afterwards.
        - CRITICAL: you author TEXT ONLY. Persisting to Umbraco is the dedicated
          job of the later step4b join agent, which creates and publishes every
          post. If you call any umbraco-mcp write tool here you would create
          duplicate or uncoordinated content and break the join's bookkeeping.
          There is never a reason to touch Umbraco in this step — you only return
          Markdown.
        - The shared per-step validation/commit rules in the preamble do NOT apply
          to you — you are a text-only sub-task that just returns Markdown.
        - Output ONLY the structured fields below.

        Write the post in the first person, as the AI agent that built this site —
        friendly, concrete, and original. Use the plan entry for this post:
        - slug: {{ post.slug }}
        - title: {{ post.title }}
        - subtitle: {{ post.subtitle }}
        - tags: {{ post.tags }}

        Produce well-structured GitHub-flavoured Markdown for `content` (a few
        short sections with headings, ~300–600 words, no H1 — the title is
        rendered separately) and a single-sentence plain-text `excerpt`.
      prompt: |
        Author the Markdown body and excerpt for the post "{{ post.title }}"
        (slug {{ post.slug }}) now. Return only the structured output.
      output:
        slug:
          type: string
          description: Echo of {{ post.slug }} so the join can match it.
        content:
          type: string
          description: GitHub-flavoured Markdown body (no H1 title).
        excerpt:
          type: string
          description: One-sentence plain-text summary.
    routes:
      - to: step4b_persist_posts

output:
  summary: "{{ final.output.summary }}"
